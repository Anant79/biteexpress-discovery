services:
  mongo:
    image: mongo:7.0
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/biteexpress
      SEED_PATH: /app/data/zomato.csv
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data: {}
